spring:
  application:
    name: sgce-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${SGCE_REDIS_HOST:localhost}
      port: ${SGCE_REDIS_PORT:6379}
  datasource:
    url: ${SGCE_DB_URL:jdbc:postgresql://localhost:5433/sgce}
    # Runtime usa sgce_app (sem SUPERUSER/BYPASSRLS) para RLS valer de fato.
    # Migrations Flyway rodam como sgce (owner) via spring.flyway.* abaixo.
    username: ${SGCE_DB_USER:sgce_app}
    password: ${SGCE_DB_PASSWORD:sgce_app_dev}
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Flyway roda com o usuário owner (superuser), o backend em runtime usa sgce_app.
    user: ${SGCE_DB_ADMIN_USER:sgce}
    password: ${SGCE_DB_ADMIN_PASSWORD:sgce_dev}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

sgce:
  jwt:
    # Secret DEV — nunca usar em prod. Skill 10 externaliza via env.
    secret: ${SGCE_JWT_SECRET:dev-only-secret-please-change-at-least-64-characters-long-for-hs256}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
    access-cookie-name: sgce_access
    refresh-cookie-name: sgce_refresh
    cookie-secure: ${SGCE_JWT_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${SGCE_CORS_ORIGINS:http://localhost:4200,http://localhost}
  s3:
    endpoint: ${SGCE_S3_ENDPOINT:http://localhost:9000}
    region: ${SGCE_S3_REGION:us-east-1}
    access-key: ${SGCE_S3_ACCESS_KEY:minioadmin}
    secret-key: ${SGCE_S3_SECRET_KEY:minioadmin}
    bucket: ${SGCE_S3_BUCKET:sgce-uploads}
    path-style-access: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.campanha: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: redis
      port: 6379
  datasource:
    url: jdbc:postgresql://postgres:5432/sgce
    username: sgce_app
    password: sgce_app_dev
  flyway:
    user: sgce
    password: sgce_dev

sgce:
  s3:
    endpoint: http://minio:9000
  cors:
    allowed-origins: http://localhost,http://frontend

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

sgce:
  jwt:
    secret: test-only-secret-please-change-at-least-64-characters-long-for-hs256
