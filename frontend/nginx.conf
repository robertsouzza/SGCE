server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA fallback: rotas do Angular resolvem no client
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy do backend REST — same-origin para o cookie httpOnly viajar
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 120s;
  }

  # Actuator (health/info) — usado pelo SyncService ping
  location /actuator/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # WebSocket/STOMP para /ws (skill 06 tempo-real + skill 08 dashboard)
  location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Swagger só em dev (skill 10 esconde em prod)
  location /swagger-ui/ { proxy_pass http://backend:8080; }
  location /v3/api-docs/ { proxy_pass http://backend:8080; }
}
